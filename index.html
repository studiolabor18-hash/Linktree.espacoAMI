<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Espaço A.M.I</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --verde-claro: #9CCC3C;
    --verde-medio: #6FA83A;
    --verde-escuro: #4E7A2E;
    --oliva: #8A8C3C;
    --creme: #FAF9EE;
    --texto: #33421F;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Nunito', sans-serif;
    background: linear-gradient(160deg, #FAF9EE 0%, #EAF3D6 45%, #DCEBC0 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 48px 20px 60px;
    color: var(--texto);
  }

  .card {
    width: 100%;
    max-width: 440px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .avatar-ring {
    width: 132px;
    height: 132px;
    border-radius: 50%;
    padding: 4px;
    background: linear-gradient(135deg, var(--verde-claro), var(--verde-medio));
    margin-bottom: 18px;
  }

  .avatar {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    overflow: hidden;
    background: #fff;
    border: 4px solid #fff;
  }

  .avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  h1 {
    font-family: 'Fredoka', sans-serif;
    font-size: 28px;
    font-weight: 600;
    color: var(--verde-escuro);
    letter-spacing: 0.3px;
  }

  .subtitulo {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--oliva);
    margin-top: 6px;
  }

  .bio {
    font-size: 15px;
    line-height: 1.5;
    color: #4B5A38;
    margin-top: 14px;
    padding: 0 8px;
  }

  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-top: 16px;
  }

  .tag {
    background: rgba(111,168,58,0.15);
    color: var(--verde-escuro);
    font-size: 12px;
    font-weight: 700;
    padding: 6px 14px;
    border-radius: 20px;
  }

  .links {
    width: 100%;
    margin-top: 30px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .btn {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    padding: 16px 20px;
    border-radius: 16px;
    text-decoration: none;
    font-weight: 700;
    font-size: 16px;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
    box-shadow: 0 4px 14px rgba(78,122,46,0.12);
  }

  .btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(78,122,46,0.2);
  }

  .btn-primary {
    background: linear-gradient(135deg, #6FA83A, #4E7A2E);
    color: #fff;
  }

  .btn-secondary {
    background: #fff;
    color: var(--verde-escuro);
    border: 2px solid rgba(111,168,58,0.35);
  }

  .btn-icon {
    width: 26px;
    height: 26px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .btn-icon svg { width: 100%; height: 100%; }

  .btn-text {
    flex: 1;
    text-align: left;
  }

  .btn-text small {
    display: block;
    font-weight: 600;
    font-size: 11px;
    opacity: 0.75;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-top: 1px;
  }

  .socials {
    display: flex;
    gap: 16px;
    margin-top: 36px;
  }

  .social-icon {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 3px 10px rgba(78,122,46,0.15);
    transition: transform 0.25s ease;
  }

  .social-icon:hover { transform: translateY(-3px) scale(1.05); }

  .social-icon svg { width: 22px; height: 22px; }

  .handle {
    margin-top: 26px;
    font-size: 13px;
    color: #7C8A64;
    font-weight: 600;
  }

  footer {
    margin-top: 40px;
    font-size: 11px;
    color: #A3AE8C;
  }
</style>
</head>
